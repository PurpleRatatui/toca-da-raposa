<style>
  /* Paleta e fontes tiradas do CSS do metamask.com (nov/2026).
     Fonte de títulos original: Grotzec Condensed (proprietária) -> Oswald, o fallback que o próprio site usa. */
  :root {
    --orange: #ff5c16;
    --orange-dark: #661800;
    --orange-light: #ffa680;
    --orange-tint: #fff1eb;
    --purple: #d075ff;
    --purple-dark: #3d065f;
    --purple-darker: #25043a;
    --purple-light: #eac2ff;
    --green: #baf24a;
    --green-dark: #013330;
    --green-light: #e5ffc3;
    --blue: #89b0ff;
    --blue-dark: #190066;
    --blue-light: #cce7ff;
    --neutral: #f0e7e4;
    --ink: #121314;
    --muted: #686e7d;
    --line: #e2d6d1;
    --white: #ffffff;
    --error: #ca3542;

    --font-display: "Oswald", "Arial Narrow", sans-serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: "JetBrains Mono", Menlo, Consolas, monospace;

    --r-sm: 8px;
    --r-md: 16px;
    --r-lg: 28px;
    --pill: 999px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--neutral);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  button { font: inherit; cursor: pointer; }

  /* ---------- top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 14px 24px;
    background: color-mix(in srgb, var(--neutral) 88%, transparent);
    backdrop-filter: blur(10px);
  }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
  .brand svg.fox { width: 30px; height: auto; }
  .brand svg.word { height: 26px; width: auto; }
  .lang {
    display: inline-flex; padding: 4px; gap: 2px;
    background: var(--white); border-radius: var(--pill);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .lang button {
    border: 0; background: transparent; color: var(--ink);
    padding: 6px 12px; border-radius: var(--pill);
    font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em;
  }
  .lang button[aria-pressed="true"] { background: var(--ink); color: var(--white); }

  /* ---------- layout ---------- */
  main { max-width: 760px; margin: 0 auto; padding: 8px 24px 80px; }

  /* ---------- hero ---------- */
  .hero {
    position: relative; overflow: hidden;
    background: var(--purple-dark); color: var(--white);
    border-radius: var(--r-lg);
    padding: 48px 40px 40px;
    margin-top: 8px;
  }
  .hero .shapes { position: absolute; inset: 0; pointer-events: none; }
  .hero .shapes span { position: absolute; display: block; }
  .s1 { width: 180px; height: 180px; border-radius: 50%; background: var(--orange); right: -50px; top: -60px; }
  .s2 { width: 120px; height: 56px; border-radius: var(--pill); background: var(--green); right: 70px; bottom: 34px; transform: rotate(-12deg); }
  .s3 { width: 64px; height: 64px; border-radius: 18px; background: var(--purple); right: 30px; top: 150px; transform: rotate(18deg); }
  .hero > *:not(.shapes) { position: relative; }
  .eyebrow {
    display: inline-block; font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    background: var(--purple-light); color: var(--purple-darker); padding: 6px 12px; border-radius: var(--pill);
  }
  .hero h1 {
    font-family: var(--font-display); font-weight: 600; text-transform: uppercase;
    font-size: clamp(48px, 10vw, 88px); line-height: .92; letter-spacing: -.01em;
    margin: 22px 0 18px; max-width: 11ch;
  }
  .hero h1 em { font-style: normal; color: var(--orange); display: block; }
  .hero p { font-size: 18px; line-height: 1.5; max-width: 52ch; margin: 0 0 16px; color: #f3e6fb; }
  .hero p.lead2 { margin-bottom: 28px; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 30px; padding: 0; list-style: none; }
  .facts li {
    font-size: 14px; padding: 7px 14px; border-radius: var(--pill);
    background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
  }

  /* ---------- perks (intro) ---------- */
  .section-title {
    font-family: var(--font-display); font-weight: 600; text-transform: uppercase;
    font-size: clamp(30px, 6vw, 42px); line-height: 1; margin: 44px 0 16px;
  }
  .perks { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .perk { border-radius: var(--r-md); padding: 22px 22px 24px; }
  .perk .num { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; opacity: .7; }
  .perk h3 { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; font-size: 24px; line-height: 1.05; margin: 10px 0 8px; }
  .perk p { margin: 0; font-size: 15px; }
  .perk.p1 { background: var(--orange); color: var(--white); }
  .perk.p2 { background: var(--purple-light); color: var(--purple-darker); }
  .perk.p3 { background: var(--green); color: var(--green-dark); }
  .perk.p4 { background: var(--blue-light); color: var(--blue-dark); }
  .who { margin-top: 12px; background: var(--white); border-radius: var(--r-md); padding: 22px 24px; }
  .who h3 { margin: 0 0 8px; font-size: 16px; }
  .who p { margin: 0; color: var(--ink); }
  .cta-bottom { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 28px; }
  .cta-bottom span { color: var(--muted); font-size: 14px; }

  /* ---------- nota da Ana ---------- */
  .note {
    display: grid; grid-template-columns: 120px 1fr; gap: 24px; align-items: center;
    margin: 12px 0 0; background: var(--white); border-radius: var(--r-lg); padding: 28px 32px;
  }
  .note img {
    width: 120px; height: 120px; border-radius: 50%; object-fit: cover; object-position: 50% 30%;
    box-shadow: 0 0 0 4px var(--white), 0 0 0 7px var(--orange);
  }
  .note blockquote { margin: 0; font-size: 18px; line-height: 1.5; color: var(--ink); }
  .note .sig { margin-top: 14px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .note .sig strong { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; font-size: 22px; letter-spacing: .01em; }
  .note .sig span { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    border: 0; border-radius: var(--pill);
    padding: 16px 28px; font-size: 16px; font-weight: 600;
    transition: transform .12s ease, background-color .12s ease;
  }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--orange); color: var(--white); }
  .btn-primary:hover { background: #fa4b00; }
  .btn-ink { background: var(--ink); color: var(--white); }
  .btn-ink:hover { background: #242628; }
  .btn-ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .btn-ghost:hover { background: rgba(18,19,20,.05); }
  .btn-ghost.on-dark { color: var(--white); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.6); }
  .btn[disabled] { opacity: .5; cursor: progress; }
  .btn .arrow { font-family: var(--font-mono); }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  /* ---------- progress ---------- */
  .progress { margin: 28px 0 18px; }
  .progress-meta { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .step-count { font-family: var(--font-mono); font-size: 13px; color: var(--muted); letter-spacing: .04em; }
  .bars { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .bars span { height: 6px; border-radius: var(--pill); background: var(--line); transition: background-color .2s; }
  .bars span.done { background: var(--ink); }
  .bars span.on { background: var(--orange); }

  /* ---------- step card ---------- */
  .card { background: var(--white); border-radius: var(--r-lg); padding: 36px 36px 32px; }
  .card h2 {
    font-family: var(--font-display); font-weight: 600; text-transform: uppercase;
    font-size: clamp(34px, 6.5vw, 48px); line-height: 1; letter-spacing: -.005em; margin: 0 0 10px;
  }
  .card .intro { color: var(--muted); margin: 0 0 8px; max-width: 58ch; }
  .callout {
    margin: 18px 0 6px; padding: 20px 22px; border-radius: var(--r-md);
    background: var(--green-light); color: var(--green-dark);
  }
  .callout h3 { margin: 0 0 10px; font-size: 15px; font-weight: 700; }
  .callout ul { margin: 0; padding-left: 20px; }
  .callout li { margin: 4px 0; }
  .callout p { margin: 10px 0 0; font-size: 14px; }

  .field { margin-top: 28px; border: 0; padding: 0; min-width: 0; }
  .field > legend, .field > label.q {
    display: block; font-weight: 600; font-size: 16px; margin: 0 0 4px; padding: 0;
  }
  .req { color: var(--orange); margin-left: 2px; }
  .help { display: block; color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .q-spacer { height: 8px; }

  input[type="text"], input[type="email"], input[type="url"], input[type="tel"], select, textarea {
    width: 100%; font: inherit; color: var(--ink);
    background: var(--orange-tint); border: 1.5px solid transparent; border-radius: var(--r-sm);
    padding: 13px 14px; transition: border-color .15s, background-color .15s;
  }
  input::placeholder, textarea::placeholder { color: #9a8f8b; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ink); background: var(--white); }
  textarea { min-height: 112px; resize: vertical; }
  select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 40px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* chips (radio / checkbox) */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips.stack { flex-direction: column; align-items: stretch; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .chip span {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-radius: var(--pill);
    background: var(--white); box-shadow: inset 0 0 0 1.5px var(--line);
    font-size: 15px; line-height: 1.3; transition: background-color .12s, box-shadow .12s, color .12s;
    cursor: pointer; user-select: none;
  }
  .chips.stack .chip span { display: flex; border-radius: var(--r-md); padding: 14px 18px; }
  .chip:hover span { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .chip input:checked + span { background: var(--ink); color: var(--white); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .chip input:focus-visible + span { outline: 3px solid var(--blue); outline-offset: 2px; }
  .chip input:disabled + span { opacity: .4; cursor: not-allowed; }
  .chip span::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
  .chip input:checked + span::before { background: var(--orange); }

  /* platforms */
  .plat-rows { display: grid; gap: 10px; margin-top: 14px; }
  .plat-row {
    display: grid; grid-template-columns: 120px 1fr 190px; gap: 10px; align-items: center;
    padding: 10px; border-radius: var(--r-md); background: var(--neutral);
  }
  .plat-row .pname { font-family: var(--font-mono); font-size: 13px; padding-left: 6px; }
  .plat-row input, .plat-row select { background: var(--white); }

  /* consent */
  .consent { display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px; border-radius: var(--r-md); background: var(--neutral); cursor: pointer; }
  .consent input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--orange); flex: none; }
  .consent span { font-size: 14px; }

  /* errors */
  .err { display: none; color: var(--error); font-size: 14px; margin-top: 8px; font-weight: 500; }
  .field.invalid .err { display: block; }
  .field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--error); }
  .field.invalid .chip span { box-shadow: inset 0 0 0 1.5px #f0b4ba; }
  .counter { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-left: 6px; font-weight: 500; }

  /* nav */
  .nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--line); }
  .nav .spacer { flex: 1; }
  .saved { font-size: 13px; color: var(--muted); }

  /* done */
  .done .big-fox { width: 84px; margin-bottom: 12px; }
  .testmode { margin-top: 20px; padding: 14px 16px; border-radius: var(--r-md); background: var(--orange-tint); color: var(--orange-dark); font-size: 14px; }
  .testmode pre { white-space: pre-wrap; word-break: break-word; font-family: var(--font-mono); font-size: 12px; max-height: 260px; overflow: auto; margin: 10px 0 0; }

  footer { max-width: 760px; margin: 0 auto; padding: 0 24px 40px; color: var(--muted); font-size: 13px; }

  @media (max-width: 640px) {
    .topbar { padding: 12px 16px; }
    .brand svg.word { display: none; }
    main { padding: 4px 16px 64px; }
    footer { padding: 0 16px 32px; }
    .hero { padding: 36px 24px 28px; border-radius: 22px; }
    .s1 { width: 120px; height: 120px; right: -40px; top: -40px; }
    .s2 { width: 80px; height: 40px; right: 18px; bottom: 18px; }
    .s3 { display: none; }
    .hero p { font-size: 16px; }
    .perks { grid-template-columns: 1fr; }
    .note { grid-template-columns: 1fr; gap: 18px; padding: 24px 22px; border-radius: 22px; }
    .note img { width: 88px; height: 88px; }
    .note blockquote { font-size: 16px; }
    .card { padding: 26px 20px 24px; border-radius: 22px; }
    .row2 { grid-template-columns: 1fr; }
    .plat-row { grid-template-columns: 1fr 1fr; }
    .plat-row .pname { grid-column: 1 / -1; padding: 2px 4px 0; }
    .btn { padding: 15px 22px; }
    .nav .saved { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style>
  /* ============================================================
     Estilo da máquina (toca-da-raposa.html): papel com textura,
     contornos de nanquim, sombras chapadas e rótulos em mono.
     ============================================================ */
  :root { --paper:#f0e7e4; --card:#fbf8f3; --ink:#121314; --hard:3px 3px 0 var(--ink); --hard-lg:5px 5px 0 var(--ink); }
  body {
    background-color: var(--paper);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .39  0 0 0 0 .33  .16 0 0 0 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>");
  }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  /* top bar like the machine: fox + title in Oswald */
  .topbar { background: transparent; backdrop-filter: none; position: relative; padding: 18px 24px 8px; max-width: 808px; margin: 0 auto; }
  .brand svg.word { display: none; }
  .brand-title { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; font-size: 22px; letter-spacing: .01em; }
  .lang { box-shadow: inset 0 0 0 1px var(--line); }

  /* hero = the black cabinet */
  .hero { background: var(--ink); border: 2.5px solid var(--ink); border-radius: 22px; box-shadow: 6px 6px 0 var(--orange); }
  .hero .shapes span { border: 2.5px solid var(--ink); filter: url(#hand); }
  .eyebrow { background: var(--green); color: var(--ink); border: 1.5px solid var(--ink); box-shadow: 2px 2px 0 rgba(255,255,255,.85); }
  .hero p { color: #ece6e1; }
  .facts li { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; background: transparent; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.55); }

  /* buttons: arcade keys with hard shadows */
  .btn {
    font-family: var(--font-mono); font-size: 14px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    border: 2px solid var(--ink); box-shadow: var(--hard); padding: 14px 22px;
    transition: transform .06s ease, box-shadow .06s ease, background-color .12s ease;
  }
  .btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .btn-ghost { background: var(--card); box-shadow: var(--hard); }
  .btn-ghost:hover { background: var(--card); }
  .hero .btn { box-shadow: 3px 3px 0 var(--green); }
  .hero .btn:hover { box-shadow: 4px 4px 0 var(--green); }
  .hero .btn:active { box-shadow: 1px 1px 0 var(--green); }
  .btn-ghost.on-dark { background: transparent; color: #fff; border-color: #fff; box-shadow: 3px 3px 0 var(--green); }

  /* inked cards */
  .card, .note, .who { background: var(--card); border: 2px solid var(--ink); box-shadow: var(--hard-lg); border-radius: 18px; }
  .perk { border: 2px solid var(--ink); box-shadow: var(--hard); border-radius: 16px; }
  .perk .num { font-weight: 500; opacity: .85; }
  .callout { border: 1.5px solid var(--ink); border-radius: 12px; }
  .note img { box-shadow: 0 0 0 3px var(--card), 0 0 0 5.5px var(--ink), 6px 6px 0 5.5px var(--orange); }

  /* progress: inked segments + mono counter */
  .step-count { color: var(--ink); text-transform: uppercase; }
  .bars span { height: 12px; border: 1.5px solid var(--ink); background: var(--card); }
  .bars span.done { background: var(--ink); }
  .bars span.on { background: var(--orange); }

  /* fields */
  .help { font-size: 14px; }
  input[type="text"], input[type="email"], input[type="url"], input[type="tel"], select, textarea {
    background-color: #ffffff; border: 2px solid var(--ink); border-radius: 10px;
    transition: box-shadow .08s ease, transform .08s ease;
  }
  input:focus, select:focus, textarea:focus { background-color: #ffffff; border-color: var(--ink); box-shadow: var(--hard); transform: translate(-1px, -1px); }
  .chip span { background: var(--card); box-shadow: 2px 2px 0 var(--ink); border: 1.5px solid var(--ink); transition: transform .06s, box-shadow .06s, background-color .1s, color .1s; }
  .chip:hover span { box-shadow: 3px 3px 0 var(--ink); transform: translate(-1px, -1px); }
  .chip input:checked + span { background: var(--ink); color: #fff; box-shadow: 2px 2px 0 var(--orange); border-color: var(--ink); }
  .chip input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: 3px; }
  .chip span::before { width: 10px; height: 10px; background: var(--card); border: 1.5px solid var(--ink); }
  .chip input:checked + span::before { background: var(--orange); border-color: #fff; }
  .chips.stack .chip span { border-radius: 12px; }
  .plat-row { background: var(--paper); border: 1.5px solid var(--ink); border-radius: 12px; }
  .consent { background: var(--paper); border: 1.5px solid var(--ink); border-radius: 12px; }
  .consent input { accent-color: var(--ink); }
  .field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--error); box-shadow: 3px 3px 0 var(--error); }

  /* -------------------------------------------------------------
     Identidade (1ª etapa) e trilha de produto (quem não é criador)
     ------------------------------------------------------------- */
  const CF = (id) => { for (const st of CREATOR_STEPS) for (const f of st.fields) { if (f.id === id) return f; if (f.row) { const r = f.row.find(x => x.id === id); if (r) return r; } } };
  const IDENTITY_STEP = {
    id: "identity",
    title: { pt: "Quem é você", es: "Quién sos", en: "Who you are" },
    intro: { pt: "Por enquanto, a Toca da Raposa é focada em criadores de conteúdo.", es: "Por ahora, la Guarida del Zorro está enfocada en creadores de contenido.", en: "For now, the Fox Den is focused on content creators." },
    fields: [
      { id: "identity", type: "radio", req: true, stack: true, label: { pt: "Como você se identifica?", es: "¿Cómo te identificás?", en: "How do you identify?" },
        options: [o("creator", "Criador(a) de conteúdo", "Creador/a de contenido", "Content creator"),
          o("trader", "Trader / investidor(a)", "Trader / inversor/a", "Trader / investor"),
          o("builder", "Builder / dev"),
          o("daily", "Uso cripto no dia a dia", "Uso cripto en el día a día", "I use crypto day to day"),
          o("business", "Empresa ou projeto parceiro", "Empresa o proyecto aliado", "Company or partner project"),
          o("community", "Organizo comunidade ou eventos", "Organizo comunidad o eventos", "I run a community or events"),
          o("other", "Outro", "Otro", "Other")] },
      { id: "identity_other", type: "text", req: true, label: { pt: "Qual?", es: "¿Cuál?", en: "Which?" }, showIf: d => d.identity === "other" }
    ]
  };
  // quem não é criador(a) responde só a identidade e vê a tela "Siga a Ana" (foco inicial: criadores)
  const isCreator = () => state.data.identity === "creator" || !state.data.identity;
  function steps() { return [IDENTITY_STEP, ...(isCreator() ? CREATOR_STEPS : [])]; }

  /* -------------------------------------------------------------
     Estado
     ------------------------------------------------------------- */
  const params = new URLSearchParams(location.search);
  const DEBUG = params.get("debug") === "1";   // ?debug=1 mostra o que seria gravado na planilha (modo de teste)
  const state = { lang: "pt", step: -1, data: {}, done: false, sending: false, error: false, testPayload: null };

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) { const s = JSON.parse(raw); state.data = s.data || {}; state.savedStep = s.step || 0; if (LANGS.includes(s.lang)) state.lang = s.lang; }
    } catch (e) { /* storage indisponível: segue sem rascunho */ }
    const qp = params.get("lang");
    if (LANGS.includes(qp)) state.lang = qp;
    else if (!state.data.__langSet) state.lang = ((navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']).map(l => String(l).slice(0,2).toLowerCase()).find(l => ['pt','es','en'].includes(l)) || 'pt');   // sem ?lang: idioma do navegador de quem abre
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ data: state.data, step: Math.max(state.step, 0), lang: state.lang })); } catch (e) {}
  }
  function clearDraft() { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }

  const t = (obj) => (obj ? (obj[state.lang] ?? obj.pt) : "");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const app = document.getElementById("app");
  const foot = document.getElementById("foot");

  function allFields(step) {
    const out = [];
    step.fields.forEach(f => f.row ? out.push(...f.row) : out.push(f));
    return out;
  }
  const visible = (f) => !f.showIf || f.showIf(state.data);
  const optsOf = (f) => typeof f.options === "function" ? f.options() : (f.options || []);

  /* -------------------------------------------------------------
     Render
     ------------------------------------------------------------- */
  /* ---------- Ana's floating guide: one line per section while scrolling, one per step ---------- */
  const guideWrap = document.getElementById("guideWrap"), guideBubble = document.getElementById("guideBubble");
  document.getElementById("guideAva").src = ANA_PHOTO;
  let guideText = "", guideT = 0;
  function say(text){
    if (!text || text === guideText) return;
    guideText = text; clearTimeout(guideT);
    guideBubble.classList.remove("in"); guideBubble.classList.add("typing");
    const ava = document.getElementById("guideAva"); ava.classList.remove("hop"); void ava.offsetWidth; ava.classList.add("hop");
    guideBubble.innerHTML = '<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>';
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    guideT = setTimeout(() => { guideBubble.classList.remove("typing"); guideBubble.textContent = text; void guideBubble.offsetWidth; guideBubble.classList.add("in"); guideMove(); }, reduce ? 0 : 520);
  }
  function guideIntroIndex(){
    const marks = [".hero", ".hero .lead2", ".section-title", ".perks .p3", ".cta-bottom"].map(q => app.querySelector(q));
    let k = 0;
    marks.forEach((el, i) => { if (el && el.getBoundingClientRect().top < innerHeight * (i === marks.length - 1 ? .8 : .38)) k = i; });
    return k;
  }
  // left -> right depending on where the person is
  function guideMove(){
    const g = guideWrap.querySelector(".guide");
    let p = 0;
    if (state.done) p = 1;
    else if (state.step < 0){ const max = document.documentElement.scrollHeight - innerHeight; p = max > 0 ? window.scrollY / max : 0; }
    else { const n = steps().length; p = n > 1 ? state.step / (n - 1) : 0; }
    const cs = getComputedStyle(guideWrap), room = guideWrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - g.offsetWidth;
    g.style.translate = `${Math.max(0, room) * Math.min(1, Math.max(0, p))}px 0`;
  }
  addEventListener("resize", () => guideMove());
  function guideUpdate(){
    document.getElementById("guideRole").textContent = t(UI.noteRole);
    guideWrap.classList.toggle("float", !state.done && state.step < 0);
    guideWrap.classList.toggle("stuck", !state.done && state.step < 0 && window.scrollY > 24);
    if (state.done) say(t(state.data.identity === "trader" ? UI.guideTrader : !isCreator() ? UI.guideFollow : showGroup() && CFG.WHATSAPP_URL ? UI.guideDoneGroup : UI.guideDone));
    else if (state.step < 0) { const gi = guideIntroIndex(); say(gi === 0 && (params.has("fox") || params.has("shared")) ? t(UI.guideBack) : UI.guideIntro[state.lang][gi]); }
    else { const st = steps()[state.step]; say(st && UI.guideStep[st.id] ? t(UI.guideStep[st.id]) : ""); }
    guideMove();
  }
  let guideRAF = 0;
  addEventListener("scroll", () => { if (state.step >= 0 || state.done || guideRAF) return; guideRAF = requestAnimationFrame(() => { guideRAF = 0; guideUpdate(); }); }, { passive: true });

  const HTML_LANG = { pt: "pt-BR", es: "es-AR", en: "en" };
  function render() {
    document.documentElement.lang = HTML_LANG[state.lang];
    document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
    foot.textContent = t(UI.footer);
    const bt = document.getElementById("brandTitle"); if (bt) bt.textContent = t(UI.brandName);
    const bm = document.getElementById("backMachine");
    if (bm){ const q = new URLSearchParams(); q.set("lang", state.lang); for (const k of ["ref", "utm_source"]) if (params.get(k)) q.set(k, params.get(k));
      bm.href = (CFG.MACHINE_URL || "toca-da-raposa.html") + "?" + q.toString();
      bm.querySelector(".bm-long").textContent = t(UI.backMachine); bm.querySelector(".bm-short").textContent = t(UI.backMachineShort); bm.setAttribute("aria-label", t(UI.backMachine)); }
    if (state.done) renderDone();
    else if (state.step < 0) renderIntro();
    else renderStep();
    guideUpdate();
  }

  function renderIntro() {
    const hasDraft = state.savedStep !== undefined && Object.keys(state.data).filter(k => !k.startsWith("__")).length > 0;
    const ctas = (onDark) => hasDraft
      ? `<button class="btn btn-primary" data-act="resume">${esc(t(UI.resume))} <span class="arrow">→</span></button>
         <button class="btn btn-ghost ${onDark ? "on-dark" : ""}" data-act="restart">${esc(t(UI.restart))}</button>`
      : `<button class="btn btn-primary" data-act="start">${esc(t(UI.start))} <span class="arrow">→</span></button>`;
    app.innerHTML = `
      <section class="hero">
        <div class="shapes" aria-hidden="true"><span class="s1"></span><span class="s2"></span><span class="s3"></span></div>
        <span class="eyebrow">${esc(t(UI.eyebrow))}</span>
        <h1>${t(UI.h1)}</h1>
        <p>${esc(t(UI.lead))}</p>
        <p class="lead2">${esc(t(UI.lead2))}</p>
        <ul class="facts">${UI.facts[state.lang].map(f => `<li>${esc(f)}</li>`).join("")}</ul>
        <div style="display:flex;flex-wrap:wrap;gap:10px">${ctas(true)}</div>
      </section>

      <h2 class="section-title">${esc(t(UI.perksTitle))}</h2>
      <div class="perks">
        ${UI.perks.map((p, i) => `
          <article class="perk p${i + 1}">
            <span class="num">${String(i + 1).padStart(2, "0")}</span>
            <h3>${esc(t(p.h))}</h3>
            <p>${esc(t(p.p))}</p>
          </article>`).join("")}
      </div>
      <div class="who">
        <h3>${esc(t(UI.whoTitle))}</h3>
        <p>${esc(t(UI.whoText))}</p>
      </div>
      <div class="cta-bottom">${ctas(false)} ${hasDraft ? "" : `<span>${esc(t(UI.startNote))}</span>`}</div>`;
  }

  function fieldHTML(f) {
    if (!visible(f)) return "";
    const id = "f_" + f.id;
    const val = state.data[f.id];
    const reqMark = f.req ? `<span class="req" aria-hidden="true">*</span>` : "";
    const help = f.help ? `<span class="help" id="${id}_h">${esc(t(f.help))}</span>` : "";
    const err = `<span class="err" id="${id}_e" role="alert"></span>`;
    const desc = `aria-describedby="${f.help ? id + "_h " : ""}${id}_e"`;
    const lab = t(f.label);
    const L = state.lang;

    switch (f.type) {
      case "text": case "email": case "url": case "tel":
        return `<div class="field" data-f="${f.id}">
          <label class="q" for="${id}">${esc(lab)}${reqMark}</label>${help}
          <input id="${id}" name="${f.id}" type="${["url", "email", "tel"].includes(f.type) ? f.type : "text"}" value="${esc(val)}" ${f.type === "tel" ? 'inputmode="tel"' : ""}
            ${f.ph ? `placeholder="${esc(typeof f.ph === "object" ? t(f.ph) : f.ph)}"` : ""} ${f.ac ? `autocomplete="${f.ac}"` : ""} ${f.req ? 'aria-required="true"' : ""} ${desc}>
          ${err}</div>`;
      case "textarea":
        return `<div class="field" data-f="${f.id}">
          <label class="q" for="${id}">${esc(lab)}${reqMark}</label>${help}
          <textarea id="${id}" name="${f.id}" ${f.req ? 'aria-required="true"' : ""} ${desc}>${esc(val)}</textarea>${err}</div>`;
      case "select": {
        const opts = optsOf(f);
        return `<div class="field" data-f="${f.id}">
          <label class="q" for="${id}">${esc(lab)}${reqMark}</label>${help}
          <select id="${id}" name="${f.id}" ${f.req ? 'aria-required="true"' : ""} ${desc}>
            <option value="">${esc(t(UI.select))}</option>
            ${opts.map(op => `<option value="${op.v}" ${val === op.v ? "selected" : ""}>${esc(op[L])}</option>`).join("")}
          </select>${err}</div>`;
      }
      case "radio": case "checks": {
        const multi = f.type === "checks";
        const arr = multi ? (val || []) : null;
        const atMax = multi && f.max && arr.length >= f.max;
        const counter = multi && f.max ? `<span class="counter">${esc(t(UI.upTo))} ${f.max}</span>` : "";
        return `<fieldset class="field" data-f="${f.id}" ${desc}>
          <legend>${esc(lab)}${reqMark}${counter}</legend>${help || '<div class="q-spacer"></div>'}
          <div class="chips ${f.stack ? "stack" : ""}">
            ${optsOf(f).map(op => {
              const checked = multi ? arr.includes(op.v) : val === op.v;
              return `<label class="chip"><input type="${multi ? "checkbox" : "radio"}" name="${f.id}" value="${op.v}" ${checked ? "checked" : ""} ${atMax && !checked ? "disabled" : ""}><span>${esc(op[L])}</span></label>`;

  /* -------------------------------------------------------------
     Validação
     ------------------------------------------------------------- */
  function validateStep() {
    const step = steps()[state.step];
    let firstBad = null;
    allFields(step).forEach(f => {
      if (!visible(f)) return;
      const el = app.querySelector(`[data-f="${f.id}"]`);
      if (!el) return;
      const v = state.data[f.id];
      let msg = "";
      if (f.type === "platforms") {
        const p = v || {};
        const keys = Object.keys(p);
        if (!keys.length) msg = t(UI.chooseAtLeast);
        else if (keys.some(k => !String(p[k].handle || "").trim() || !p[k].followers)) msg = t(UI.platMissing);
      } else if (f.req) {
        if (f.type === "checks") { if (!v || !v.length) msg = t(UI.chooseAtLeast); }
        else if (f.type === "radio") { if (!v) msg = t(UI.chooseOne); }
        else if (f.type === "consent") { if (!v) msg = t(UI.required); }
        else if (!String(v || "").trim()) msg = t(UI.required);
      }
      if (!msg && f.type === "email" && v && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v).trim())) msg = t(UI.badEmail);
      if (!msg && f.type === "tel" && v) { const dg = String(v).replace(/\D/g, ""); if (dg.length < 10 || dg.length > 15 || /[^\d\s()+.-]/.test(String(v))) msg = t(UI.badPhone); }
      el.classList.toggle("invalid", !!msg);
      const e = el.querySelector(".err"); if (e) e.textContent = msg;
      if (msg && !firstBad) firstBad = el;
    });
    if (firstBad) {
      firstBad.scrollIntoView({ behavior: "smooth", block: "center" });
      const focusable = firstBad.querySelector("input:not([disabled]), select, textarea");
      if (focusable) setTimeout(() => focusable.focus({ preventScroll: true }), 250);
    }
    return !firstBad;
  }

  /* -------------------------------------------------------------
     Montagem do payload (uma linha por inscrição na planilha, sempre em PT)
     ------------------------------------------------------------- */
  const FOLLOWER_RANK = { "lt5k": 0, "5-20k": 1, "20-100k": 2, "100-500k": 3, "500k-1m": 4, "1m+": 5 };
  function tier(platforms) {
    const ranks = Object.values(platforms || {}).map(p => FOLLOWER_RANK[p.followers] ?? -1);
    const max = Math.max(-1, ...ranks);
    if (max <= 1) return "micro (<20k)";
    if (max <= 3) return "médio (20k–500k)";
    return "grande (500k+)";
  }
  function labelPT(f, v) {
    const opts = f.id === "main_platform" ? PLATFORMS : optsOf(f);
    const find = (x) => (opts.find(op => op.v === x) || {}).pt || x;
    return Array.isArray(v) ? v.map(find).join("; ") : find(v);
  }
  // kit de produção da pelúcia (igual ao ateliê da máquina): código -> nome que vai pra planilha
  const FOX_KIT = {
    hat: { cap: "Boné", beanie: "Gorro", crown: "Coroa" },
    glasses: { sun: "Óculos de sol", round: "Óculos redondos" },
    neck: { bandana: "Bandana", scarf: "Cachecol", bow: "Gravata borboleta" },
    hand: { card: "Cartão MetaMask", phone: "Celular" }
  };
  const foxName = s => (s || "").replace(/[^\p{L}\p{N} -]/gu, "").replace(/ {2,}/g, " ").trim().slice(0, 12);
  function foxSlots() {
    const picked = (params.get("items") || "").split(",").map(x => x.trim());
    const out = {};
    Object.keys(FOX_KIT).forEach(slot => {
      const code = picked.find(c => FOX_KIT[slot][c]);
      out["fox_" + slot] = code ? FOX_KIT[slot][code] : "";
    });
    return out;
  }
  // link wa.me clicável na planilha; completa o código do país quando a pessoa não colocou
  function waLink(v, country) {
    const raw = String(v || "").trim(); let dg = raw.replace(/\D/g, "");
    if (!dg) return "";
    if (!raw.startsWith("+") && !dg.startsWith("00")) {
      if (country === "br" && (dg.length === 10 || dg.length === 11)) dg = "55" + dg;
      else if (country === "ar" && dg.length === 10) dg = "549" + dg;
    }
    return "https://wa.me/" + dg.replace(/^00/, "");
  }
  function buildPayload() {
    const d = state.data;
    const out = {
      submitted_at: new Date().toISOString(),
      form_language: state.lang.toUpperCase(),
      source: params.get("ref") || params.get("utm_source") || "",
      identity: "",
      track: isCreator() ? "criador" : "seguir",
      tier_auto: isCreator() ? tier(d.platforms) : "",
      fox_name: foxName(params.get("fox")),
      ...foxSlots(),
      fox_items: params.get("items") || "",
      share_action: params.get("shared") || ""
    };
    steps().forEach(step => allFields(step).forEach(f => {
      if (f.type === "platforms") {
        PLATFORMS.forEach(p => {
          const row = (d.platforms || {})[p.v];
          out[`${p.v}_handle`] = row ? row.handle : "";
          out[`${p.v}_followers`] = row ? (FOLLOWERS.find(x => x.v === row.followers) || {}).pt || "" : "";
        });
        return;
      }
      if (!visible(f)) { out[f.id] = ""; return; }
      const v = d[f.id];
      if (f.type === "consent") out[f.id] = v ? "sim" : "não";
      else if (["radio", "checks", "select"].includes(f.type)) out[f.id] = v ? labelPT(f, v) : "";
      else out[f.id] = (v || "").toString().trim();
    }));
    out.whatsapp_link = waLink(d.whatsapp, d.country);
    if (isCreator()) out.my_ref = myRef();   // código do link de indicação deste criador
    return out;
  }

  async function submit() {
    const payload = buildPayload();
    if (!CFG.SUBMIT_URL) {
      console.info("[MetaMask Creators] modo de teste — payload:", payload);
      state.testPayload = payload; state.done = true; clearDraft(); render(); window.scrollTo(0, 0); return;
    }
    state.sending = true; state.error = false; render();
    try {
      await fetch(CFG.SUBMIT_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
      state.done = true; clearDraft();
    } catch (e) {
      state.error = true;
    }
    state.sending = false; render(); window.scrollTo(0, 0);
  }

  /* -------------------------------------------------------------
     Eventos
     ------------------------------------------------------------- */
  document.querySelector(".lang").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-lang]"); if (!b) return;
    state.lang = b.dataset.lang; state.data.__langSet = true; save(); render();
  });

  app.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const act = b.dataset.act;
    if (act === "start") { state.step = 0; }
    if (act === "resume") { state.step = Math.min(state.savedStep || 0, steps().length - 1); }
    if (act === "restart") { const ls = state.data.__langSet; state.data = ls ? { __langSet: true } : {}; clearDraft(); state.step = 0; }
    if (act === "back") { state.error = false; state.step -= 1; }
    if (act === "invite-copy" || act === "invite-share") {
      const link = inviteLink(), note = app.querySelector(".invite-note");
      if (act === "invite-share") { navigator.share({ text: t(UI.inviteMsg), url: link }).catch(() => {}); return; }
      const done = () => { if (note) note.textContent = t(UI.inviteCopied); };
      (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(done).catch(() => { const i = app.querySelector(".invite-link"); i.select(); try { document.execCommand("copy"); done(); } catch (e) {} });
      return;
    }
    if (act === "unfollow") { state.done = false; state.testPayload = null; state.chatSent = false; state.data.identity = "creator"; state.step = 0; }
    save(); render(); window.scrollTo({ top: 0 });
  });

  app.addEventListener("submit", (e) => {
    e.preventDefault();
    if (e.target.classList.contains("chat-form")) return submitChat(e.target);
    if (!validateStep()) return;
    if (state.step < steps().length - 1) { state.step += 1; save(); render(); window.scrollTo({ top: 0 }); }
    else submit();
  });

  // Texto: atualiza sem re-render (mantém o foco)
  app.addEventListener("input", (e) => {
    const el = e.target;
    if (el.dataset.plat) {
      const p = state.data.platforms = state.data.platforms || {};
      if (p[el.dataset.plat]) p[el.dataset.plat][el.dataset.k] = el.value;
    } else if (el.name && (el.tagName === "TEXTAREA" || ["text", "email", "url", "tel"].includes(el.type))) {
      state.data[el.name] = el.value;
    } else return;
    const field = el.closest(".field"); if (field && field.classList.contains("invalid")) field.classList.remove("invalid");
    save();
  });

  // Escolhas: atualiza e re-renderiza (campos condicionais)
  app.addEventListener("change", (e) => {
    const el = e.target;
    if (el.dataset.plat && el.tagName === "SELECT") {
      const p = state.data.platforms || {}; if (p[el.dataset.plat]) p[el.dataset.plat].followers = el.value; save();
      const field = el.closest(".field"); if (field) field.classList.remove("invalid");
      return;
    }
    if (!el.name) return;
    const name = el.name;
    if (name === "platforms") {
      const p = state.data.platforms = state.data.platforms || {};
      if (el.checked) p[el.value] = p[el.value] || { handle: "", followers: "" };
      else { delete p[el.value]; if (state.data.main_platform === el.value) state.data.main_platform = ""; }
    } else if (el.type === "checkbox" && name === "consent") {
      state.data.consent = el.checked;
    } else if (el.type === "checkbox") {
      const arr = new Set(state.data[name] || []);
      el.checked ? arr.add(el.value) : arr.delete(el.value);
      state.data[name] = [...arr];
    } else if (el.type === "radio" || el.tagName === "SELECT") {
      state.data[name] = el.value;
    } else return;
    save();
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
    const again = app.querySelector(`[name="${name}"][value="${CSS.escape(el.value)}"]`) || app.querySelector(`[name="${name}"]`);
    if (again) again.focus({ preventScroll: true });
  });

  load();
  render();
})();
</script>
</body>
</html>
